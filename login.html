<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple Style Authentication</title>
    <!-- Fonte Inter simulando a San Francisco da Apple -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <!-- Fundo de Gradiente Fluido (Estilo macOS/iOS) -->
    <div class="bg-mesh">
        <div class="gradient-blob shape-1"></div>
        <div class="gradient-blob shape-2"></div>
        <div class="gradient-blob shape-3"></div>
    </div>

    <!-- Cena 3D -->
    <div class="scene">
        <div class="card" id="authCard">
            
            <!-- ====== FRENTE: LOGIN (DARK) ====== -->
            <div class="card-face card-front">
                <div class="card-content">
                    <div class="header">
                        <h2>Acessar</h2>
                        <p>Use seu Apple ID ou Email</p>
                    </div>

                    <button class="btn-secondary">
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                        </svg>
                        Continuar com Google
                    </button>

                    <div class="divider">
                        <span>ou</span>
                    </div>

                    <form id="loginForm">
                        <div class="form-group">
                            <input type="email" placeholder="Email" required>
                        </div>
                        <div class="form-group">
                            <input type="password" placeholder="Senha" required>
                        </div>

                        <div class="options">
                            <a href="#" class="forgot-password">Esqueceu a senha?</a>
                        </div>

                        <button type="submit" class="btn-primary">Entrar</button>
                    </form>
                </div>

                <div class="footer">
                    Ainda não tem conta? <button type="button" class="toggle-btn" onclick="toggleCard()">Crie uma agora</button>
                </div>
            </div>

            <!-- ====== VERSO: CADASTRO (LIGHT) ====== -->
            <div class="card-face card-back">
                <div class="card-content">
                    <div class="header">
                        <h2>Criar Conta</h2>
                        <p>Junte-se ao nosso ecossistema</p>
                    </div>

                    <form id="registerForm">
                        <div class="form-group">
                            <input type="text" placeholder="Nome completo" required>
                        </div>
                        <div class="form-group">
                            <input type="email" placeholder="Email" required>
                        </div>
                        <div class="form-group">
                            <input type="password" placeholder="Senha" required>
                        </div>

                        <button type="submit" class="btn-primary" style="margin-top: 24px;">Continuar</button>
                    </form>
                </div>

                <div class="footer">
                    Já possui uma conta? <button type="button" class="toggle-btn" onclick="toggleCard()">Faça login</button>
                </div>
            </div>

        </div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
