<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova senha no Fluxo</title>
</head>
<body data-page="login">

    <div class="bg-mesh">
        <div class="gradient-blob shape-1"></div>
        <div class="gradient-blob shape-2"></div>
        <div class="gradient-blob shape-3"></div>
    </div>

    <div class="scene">
        <div class="card">
            <div class="card-face card-front">
                <div class="card-content">
                    <div class="header">
                        <h2>Nova senha</h2>
                        <p>Escolha a senha que você vai usar a partir de agora</p>
                    </div>

                    <form id="resetForm" novalidate>
                        <div class="form-group" data-field="password">
                            <label>Nova senha</label>
                            <input type="password" name="password" autocomplete="new-password" minlength="8">
                        </div>
                        <div class="form-group" data-field="confirmation">
                            <label>Repita a nova senha</label>
                            <input type="password" name="confirmation" autocomplete="new-password">
                        </div>
                        <button type="submit" class="btn-primary">Salvar nova senha</button>
                    </form>

                    <p id="resetInvalid" hidden class="form-notice">
                        Este link não é mais válido. <a href="/login.html">Voltar ao login</a> e pedir outro.
                    </p>
                </div>

                <div class="footer">
                    Lembrou a senha? <a href="/login.html">Entrar no Fluxo</a>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="/src/pages/reset-password.js"></script>
</body>
</html>
