<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workspace - Apple Style</title>
    </head>
<body data-page="workspace">

    <!-- Fundo Aurora (Mesh Gradient) -->
    <div class="bg-mesh">
        <div class="gradient-blob shape-1"></div>
        <div class="gradient-blob shape-2"></div>
        <div class="gradient-blob shape-3"></div>
    </div>

    <!-- Container Principal -->
    <div class="scene">
        <div class="card glass-panel">
            
            <!-- Trilho de Navegação (Slider) -->
            <div class="slider" id="viewSlider">
                
                <!-- ================= VISTA 1: HOME (CONVITES E OPÇÕES) ================= -->
                <div class="view" id="view-home">
                    <div class="header">
                        <h2>Seus Espaços</h2>
                        <p>Escolha como deseja começar</p>
                    </div>

                    <div class="section">
                        <h3 class="section-title">Seus Workspaces</h3>
                        <div class="list-group" id="workspaceList"></div>
                    </div>

                    <!-- Seção: Ações -->
                    <div class="section">
                        <h3 class="section-title">Outras Opções</h3>
                        
                        <div class="list-group">
                            <button class="list-item nav-btn" data-view="view-code">
                                <div class="item-icon bg-purple">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 7h3a5 5 0 0 1 5 5 5 5 0 0 1-5 5h-3m-6 0H6a5 5 0 0 1-5-5 5 5 0 0 1 5-5h3m-1 5h8"/></svg>
                                </div>
                                <div class="item-text">
                                    <h4>Entrar com Código</h4>
                                    <span>Use o código de 8 caracteres do convite</span>
                                </div>
                                <div class="item-chevron">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg>
                                </div>
                            </button>

                            <div class="list-divider"></div>

                            <button class="list-item nav-btn" data-view="view-create">
                                <div class="item-icon bg-dark">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
                                </div>
                                <div class="item-text">
                                    <h4>Criar novo Workspace</h4>
                                    <span>Inicie um ambiente do zero</span>
                                </div>
                                <div class="item-chevron">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg>
                                </div>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- ================= VISTA 2: ENTRAR COM CÓDIGO ================= -->
                <div class="view" id="view-code">
                    <div class="nav-bar">
                        <button class="back-btn" data-view="view-home">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
                            Voltar
                        </button>
                    </div>

                    <div class="header">
                        <h2>Entrar com Código</h2>
                        <p>Insira o código fornecido pelo admin</p>
                    </div>

                    <form class="view-form" id="codeForm">
                        <div class="code-input-container">
                            <input type="text" class="code-input" placeholder="A1B2C3D4" maxlength="8" required>
                        </div>
                        <p class="form-error" id="codeError"></p>
                        <button type="submit" class="btn-primary">Entrar no Espaço</button>
                    </form>
                </div>

                <!-- ================= VISTA 3: CRIAR WORKSPACE (Placeholder) ================= -->
                <div class="view" id="view-create">
                    <div class="nav-bar">
                        <button class="back-btn" data-view="view-home">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
                            Voltar
                        </button>
                    </div>

                    <div class="header">
                        <h2>Novo Workspace</h2>
                        <p>Dê um nome ao seu novo espaço</p>
                    </div>

                    <form class="view-form" id="createForm">
                        <div class="form-group">
                            <input type="text" placeholder="Ex: Acme Corp" minlength="3" maxlength="80" required>
                        </div>
                        <p class="form-error" id="createError"></p>
                        <button type="submit" class="btn-primary">Continuar</button>
                    </form>
                </div>

            </div>
        </div>
    </div>

    <script type="module" src="/src/pages/workspace.js"></script>
</body>
</html>
