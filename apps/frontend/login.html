<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar no Fluxo</title>
    </head>
<body data-page="login">

    <!-- Fundo de Gradiente Fluido -->
    <div class="bg-mesh">
        <div class="gradient-blob shape-1"></div>
        <div class="gradient-blob shape-2"></div>
        <div class="gradient-blob shape-3"></div>
    </div>

    <!-- Cena 3D -->
    <div class="scene">
        <div class="card" id="authCard">

            <!-- ====== FRENTE: LOGIN (DARK) ====== -->
            <div class="card-face card-front">
                <div class="card-content">
                    <div class="header">
                        <h2>Acessar</h2>
                        <p>Entre com seu e-mail e senha</p>
                    </div>

                    <form id="loginForm" novalidate>
                        <div class="form-group">
                            <input type="email" name="email" placeholder="E-mail" autocomplete="email" required>
                        </div>
                        <div class="form-group">
                            <div class="input-wrapper">
                                <input type="password" name="password" placeholder="Senha" autocomplete="current-password" required>
                                <button type="button" class="input-action" data-action="toggle-password" aria-pressed="false" aria-label="Mostrar senha" title="Mostrar senha">
                                    <svg class="icon-show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                                    <svg class="icon-hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.9 4.24A9.1 9.1 0 0 1 12 4c6.4 0 10 7 10 7a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><path d="M6.61 6.61A18.2 18.2 0 0 0 2 11s3.6 7 10 7a9.1 9.1 0 0 0 5.39-1.61"/><path d="m2 2 20 20"/></svg>
                                </button>
                            </div>
                        </div>

                        <div class="options">
                            <button type="button" class="forgot-password" data-action="forgot">Esqueceu a senha?</button>
                        </div>

                        <button type="submit" class="btn-primary">Entrar</button>
                    </form>

                    <form id="forgotForm" class="auth-panel" hidden novalidate>
                        <div class="form-group" data-field="email">
                            <label>E-mail da conta</label>
                            <input type="email" name="email" placeholder="E-mail" autocomplete="email">
                        </div>
                        <button type="submit" class="btn-primary">Enviar link</button>
                        <button type="button" class="toggle-btn" data-action="back-to-login">Voltar</button>
                    </form>
                </div>

                <div class="footer">
                    Ainda não tem conta? <button type="button" class="toggle-btn" data-action="toggle-card">Crie uma agora</button>
                </div>
            </div>

            <!-- ====== VERSO: CADASTRO (LIGHT) ====== -->
            <div class="card-face card-back">
                <div class="card-content">
                    <div class="header">
                        <h2>Criar Conta</h2>
                        <p>Comece a organizar seus estudos</p>
                    </div>

                    <form id="registerForm" novalidate>
                        <div class="form-group">
                            <input type="text" name="name" placeholder="Nome completo" autocomplete="name" required>
                        </div>
                        <div class="form-group">
                            <input type="email" name="email" placeholder="E-mail" autocomplete="email" required>
                        </div>
                        <div class="form-group">
                            <div class="input-wrapper">
                                <input type="password" name="password" placeholder="Senha" autocomplete="new-password" minlength="8" required>
                                <button type="button" class="input-action" data-action="toggle-password" aria-pressed="false" aria-label="Mostrar senha" title="Mostrar senha">
                                    <svg class="icon-show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                                    <svg class="icon-hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.9 4.24A9.1 9.1 0 0 1 12 4c6.4 0 10 7 10 7a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><path d="M6.61 6.61A18.2 18.2 0 0 0 2 11s3.6 7 10 7a9.1 9.1 0 0 0 5.39-1.61"/><path d="m2 2 20 20"/></svg>
                                </button>
                            </div>
                        </div>

                        <button type="submit" class="btn-primary" style="margin-top: 24px;">Continuar</button>
                    </form>
                </div>

                <div class="footer">
                    Já possui uma conta? <button type="button" class="toggle-btn" data-action="toggle-card">Faça login</button>
                </div>
            </div>

        </div>
    </div>

    <script type="module" src="/src/pages/login.js"></script>
</body>
</html>
